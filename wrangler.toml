name = "remain"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "REMAIN_LEDGER"
class_name = "RemainLedger"

[[migrations]]
tag = "v1-sqlite-ledger"
new_sqlite_classes = ["RemainLedger"]

[vars]
REMAIN_EXECUTION_ENABLED = "false"
REMAIN_COW_PROFILE_REVIEWED = "false"
REMAIN_CLOUDFLARE_LIVE_APPROVED = "false"

# Stamp Git's exact deployed source commit during Wrangler build, not a mutable
# dashboard flag. Cloudflare Builds runs this command after checkout.
[build]
command = "node scripts/stamp-cloudflare-build.js"
