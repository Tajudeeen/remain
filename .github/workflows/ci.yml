name: Remain verification
on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:coverage
      - name: Screen reachable tracked history without exposing object contents
        run: npm run screen:history
      - run: npm run rehearse:plan
      - run: npm run rehearse:orders
      - run: npm run rehearse:receipt
      - run: npm run rehearse:rfq
      - name: Build fixture deployment image
        run: docker build -t remain-rehearsal:${{ github.sha }} .
      - name: Smoke fixture deployment image
        env:
          REMAIN_BUILD_SHA: ${{ github.sha }}
        run: |
          docker run -d --name remain-ci -p 3000:3000 \
            -e REMAIN_ALLOWED_HOSTS=localhost \
            -e REMAIN_BUILD_SHA="$REMAIN_BUILD_SHA" \
            remain-rehearsal:${{ github.sha }}
          trap 'docker rm -f remain-ci >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://localhost:3000/healthz >/dev/null; then break; fi
            sleep 1
          done
          REMAIN_BASE_URL=http://localhost:3000 npm run smoke:deployed
      - name: Install isolated browser verifier
        run: npx --yes agent-browser@0.38.2 install --with-deps
      - name: Verify synthetic interface in a real browser
        run: npm run test:web
      - name: Verify synthetic authenticated execution in a real browser
        run: npm run test:execution-web
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-interface-${{ github.run_id }}
          path: evidence/rehearsal-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save sanitized history screen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: history-pattern-screen-${{ github.run_id }}
          path: evidence/history-screen-*.json
          if-no-files-found: error
          retention-days: 7
