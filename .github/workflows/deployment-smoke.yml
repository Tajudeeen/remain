name: Deployed fixture smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/rehearsal/**'
      - 'src/planning/**'
      - 'src/input/**'
      - 'src/release/deployment-wait.ts'
      - 'scripts/smoke-deployed.ts'
      - 'scripts/wait-deployment.ts'
      - '.github/workflows/deployment-smoke.yml'
      - 'netlify/**'
      - 'netlify.toml'
      - 'web/**'
      - 'scripts/build-web.ts'
      - 'package*.json'
  workflow_dispatch:
    inputs:
      base_url:
        description: Public HTTPS origin for the TEST_FIXTURE deployment
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMAIN_BASE_URL: ${{ inputs.base_url || 'https://remain-cash.netlify.app/' }}
      REMAIN_EXPECTED_BUILD_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Wait for the exact main build to publish
        if: github.event_name == 'push'
        run: node scripts/wait-deployment.ts
      - name: Verify deployed fixture
        run: npm run smoke:deployed
