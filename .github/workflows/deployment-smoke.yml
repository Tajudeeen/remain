name: Deployed fixture smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public HTTPS origin for the TEST_FIXTURE deployment
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify deployed fixture
        env:
          REMAIN_BASE_URL: ${{ inputs.base_url }}
        run: npm run smoke:deployed
